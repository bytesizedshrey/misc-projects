version: "3.8"

services:
  localhostshrey:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: localhostshrey
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Dev service (optional — comment out runner above and use this for local dev)
  # localhostshrey-dev:
  #   image: node:20-alpine
  #   container_name: localhostshrey-dev
  #   working_dir: /app
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   ports:
  #     - "3000:3000"
  #   command: sh -c "npm install -g pnpm && pnpm install && pnpm dev"
  #   environment:
  #     - NODE_ENV=development

networks:
  default:
    name: localhostshrey-network
